# Single-arm demo on the physically connected Follower; PC SDK protocol.
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.10.12"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.10.1"
CONFIG_ROBOT_NODE_ID=12
CONFIG_ROBOT_HOST_NODE_ID=10
CONFIG_ROBOT_RT_PORT=5015
CONFIG_ROBOT_MGMT_PORT=5016
CONFIG_ETH_NXP_ENET_QOS_TX_OSF=n
# Largest archived datagram plus IP/UDP headers fits one data fragment.
CONFIG_NET_BUF_DATA_SIZE=1024
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_ETH_NXP_ENET_QOS_RX_BUFFER_DESCRIPTORS=16
